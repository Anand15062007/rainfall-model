[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "city-rainfall"
version = "0.1.0"
description = "Extensible city-scale rainfall prediction research system"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "PyYAML>=6", "joblib>=1.3", "matplotlib>=3.7", "requests>=2.31", "python-dotenv>=1.0", "tenacity>=8.2"]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
torch = ["torch>=2.1"]
dashboard = ["streamlit>=1.30", "folium>=0.15", "streamlit-folium>=0.18"]
database = ["sqlalchemy>=2.0"]
era5 = ["cdsapi>=0.7.7", "xarray>=2024.1", "netCDF4>=1.6"]
chirps = ["fsspec>=2024.2", "h5py>=3.10"]
dev = ["pytest>=8"]
all = ["xgboost>=2.0", "torch>=2.1", "streamlit>=1.30", "folium>=0.15", "streamlit-folium>=0.18", "sqlalchemy>=2.0", "cdsapi>=0.7.7", "xarray>=2024.1", "netCDF4>=1.6", "fsspec>=2024.2", "h5py>=3.10", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

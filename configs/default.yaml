random_seed: 42
city:
  name: Sample City
  bbox: [-74.01, 40.70, -73.98, 40.73] # min_lon, min_lat, max_lon, max_lat
  grid_size_km: 1.0
data:
  source: synthetic # set to era5 when running pipeline with --data
  start: '2022-01-01T00:00:00Z'
  periods: 500
  frequency: 1h
  rainfall_threshold_mm: 0.1
  era5_start_year: 2015
  era5_end_year: 2025
forecast:
  horizon_hours: 1
features:
  lags: [1, 3, 6, 12, 24]
  rolling_windows: [3, 6, 24]
  # ERA5 single-level predictors selected a priori from moisture, instability, cloud, wind, pressure and terrain processes.
  base_features: [temperature, dew_point, relative_humidity, wind_u_10m, wind_v_10m, pressure, cloud_cover, CAPE, CIN, total_column_water_vapour, boundary_layer_height, orography_m, rainfall_1h]
  rolling_columns: [temperature, relative_humidity, rainfall_1h, dew_point, pressure, cloud_cover, total_column_water_vapour]
preprocessing:
  scaler: standard
  missing: median
split:
  train: 0.6
  validation: 0.2
  test: 0.2
cross_validation:
  folds: 5
models:
  logistic_regression: true
  random_forest: true
  xgboost: true
  lstm: true
  selection_metric: f1 # validation threshold objective; use accuracy to optimize raw hit rate
model_params:
  logistic_regression: {max_iter: 1000, class_weight: balanced}
  random_forest: {n_estimators: 250, min_samples_leaf: 2}
  xgboost: {n_estimators: 250, max_depth: 5, learning_rate: 0.05}
lstm:
  sequence_length: 24
  hidden_size: 32
  epochs: 15
  patience: 3
  batch_size: 64
